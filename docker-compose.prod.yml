services:

  # ── Banco de dados ─────────────────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    container_name: nutribot_db
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-nutribot}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-nutribot}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-nutribot} -d ${DB_NAME:-nutribot}"]
      interval: 10s
      timeout: 5s
      retries: 10
    # Não expõe porta ao host — acesso só pela rede interna

  # ── Aplicação FastAPI ──────────────────────────────────────────────────────
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nutribot_app
    restart: always
    env_file:
      - .env.prod
    networks:
      - internal
    depends_on:
      db:
        condition: service_healthy
    command: >
      sh -c "python -m alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 2"
    healthcheck:
      test: ["CMD-SHELL", "curl -f http://localhost:8000/ping || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    # Não expõe porta ao host — Nginx faz proxy

  # ── Nginx (reverse proxy + SSL + website) ─────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    container_name: nutribot_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./website:/var/www/html:ro
      - certbot_etc:/etc/letsencrypt:ro
      - certbot_var:/var/lib/letsencrypt:ro
      - certbot_www:/var/www/certbot:ro
    networks:
      - internal
    depends_on:
      app:
        condition: service_healthy

  # ── Certbot (SSL auto-renovação) ───────────────────────────────────────────
  certbot:
    image: certbot/certbot:latest
    container_name: nutribot_certbot
    volumes:
      - certbot_etc:/etc/letsencrypt
      - certbot_var:/var/lib/letsencrypt
      - certbot_www:/var/www/certbot
    # Roda manualmente na 1ª vez; depois via cron no host
    profiles:
      - ssl
    entrypoint: >
      /bin/sh -c "trap exit TERM;
        while :; do
          certbot renew --webroot -w /var/www/certbot --quiet;
          sleep 12h & wait $${!};
        done"

networks:
  internal:
    driver: bridge

volumes:
  pgdata:
  certbot_etc:
  certbot_var:
  certbot_www:
