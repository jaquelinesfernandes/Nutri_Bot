# ── NutriBot App — app.seudominio.com ────────────────────────────────────────
# Substitua "app.seudominio.com" pelo seu domínio real.

# Redireciona HTTP → HTTPS
server {
    listen 80;
    server_name app.seudominio.com;

    # Desafio ACME do Certbot (Let's Encrypt)
    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# HTTPS — proxy para FastAPI
server {
    listen 443 ssl http2;
    server_name app.seudominio.com;

    # SSL — gerado pelo Certbot (scripts/init-ssl.sh)
    ssl_certificate     /etc/letsencrypt/live/app.seudominio.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.seudominio.com/privkey.pem;

    # Protocolos e cifras modernos
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    # HSTS
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Webhook Telegram — sem rate limit (Telegram controla a frequência)
    location /webhook/telegram {
        limit_req zone=webhook burst=20 nodelay;
        proxy_pass http://app:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }

    # Webhook Pagamento
    location /webhook/payment {
        limit_req zone=webhook burst=10 nodelay;
        proxy_pass http://app:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # API REST + Dashboard + Admin
    location / {
        limit_req zone=api burst=20 nodelay;
        proxy_pass http://app:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Suporte a SSE (Server-Sent Events) se usado no futuro
        proxy_buffering off;
        proxy_cache off;

        # Timeout para uploads de foto/áudio
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }
}
