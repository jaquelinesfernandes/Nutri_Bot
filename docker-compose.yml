services:
  db:
    image: postgres:16-alpine
    container_name: nutribot_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: nutribot
      POSTGRES_PASSWORD: nutribot_dev
      POSTGRES_DB: nutribot
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nutribot -d nutribot"]
      interval: 5s
      timeout: 5s
      retries: 10

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: nutribot_pgadmin
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: aurelianojsn@gmail.com
      PGADMIN_DEFAULT_PASSWORD: admin
      PGADMIN_CONFIG_SERVER_MODE: "False"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: "False"
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
      - ./docker/pgadmin-servers.json:/pgadmin4/servers.json:ro
    depends_on:
      db:
        condition: service_healthy

  app:
    build:
      context: .
      dockerfile: Dockerfile.dev
    container_name: nutribot_app
    restart: unless-stopped
    volumes:
      - .:/app                        # live reload — monta código-fonte
      - /app/.venv                    # exclui .venv do Windows (usa o do container)
    env_file:
      - .env.docker
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    # Aguarda o banco estar pronto antes de iniciar uvicorn
    command: >
      sh -c "python -m alembic upgrade head &&
             python -m uvicorn app.main:app --reload --host 0.0.0.0 --port 8000"

  migrate:
    image: python:3.13-slim
    container_name: nutribot_migrate
    working_dir: /app
    volumes:
      - .:/app
    env_file:
      - .env.docker
    command: >
      sh -c "pip install -q asyncpg alembic sqlalchemy pydantic pydantic-settings python-dotenv &&
             python -m alembic upgrade head"
    depends_on:
      db:
        condition: service_healthy
    profiles:
      - migrate

volumes:
  pgdata:
  pgadmin_data:
