<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{% block title %}Admin{% endblock %} — Nouri Admin</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap">
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    [hidden] { display: none !important; }
    :root {
      --bg:      #0B1120;
      --surface: #111827;
      --card:    #1A2235;
      --border:  rgba(148,163,184,.1);
      --accent:  #0A5738;
      --accent-lt: rgba(10,87,56,.12);
      --danger:  #EF4444;
      --success: #10B981;
      --warn:    #F59E0B;
      --t1: #E2E8F0;
      --t2: #94A3B8;
      --t3: #475569;
      font-size: 14px;
    }
    body { background: var(--bg); color: var(--t1); font-family: 'Plus Jakarta Sans', system-ui, sans-serif; min-height: 100vh; }

    /* ── Layout shell ── */
    .shell { display: flex; min-height: 100vh; }

    /* ── Sidebar ── */
    .sidebar {
      width: 220px; flex-shrink: 0;
      background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex; flex-direction: column;
      position: fixed; top: 0; left: 0; bottom: 0; z-index: 10;
    }
    .sidebar-brand {
      padding: 18px 16px 14px;
      border-bottom: 1px solid var(--border);
    }
    .sidebar-brand .logo {
      font-size: 15px; font-weight: 700; color: var(--t1);
      display: flex; align-items: center; gap: 8px;
    }
    .sidebar-brand .admin-badge {
      font-size: 9px; font-weight: 700; letter-spacing: .08em;
      text-transform: uppercase; background: var(--accent-lt);
      color: #25C97A; border: 1px solid rgba(10,87,56,.25);
      padding: 2px 6px; border-radius: 4px;
    }
    .sidebar-nav { flex: 1; padding: 12px 8px; overflow-y: auto; }
    .nav-section-label {
      font-size: 10px; font-weight: 600; color: var(--t3);
      letter-spacing: .08em; text-transform: uppercase;
      padding: 8px 10px 4px;
    }
    .nav-link {
      display: flex; align-items: center; gap: 10px;
      padding: 8px 10px; border-radius: 8px;
      color: var(--t2); text-decoration: none;
      font-size: 13.5px; transition: background .15s, color .15s;
      margin-bottom: 2px;
    }
    .nav-link:hover { background: var(--accent-lt); color: var(--t1); }
    .nav-link.active { background: var(--accent-lt); color: #25C97A; font-weight: 600; }
    .nav-link .icon { width: 18px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .sidebar-footer {
      padding: 12px 8px;
      border-top: 1px solid var(--border);
    }
    .logout-btn {
      width: 100%; display: flex; align-items: center; gap: 10px;
      padding: 8px 10px; border-radius: 8px;
      background: none; border: none; cursor: pointer;
      color: var(--t3); font-size: 13px;
      transition: background .15s, color .15s;
    }
    .logout-btn:hover { background: rgba(239,68,68,.1); color: var(--danger); }

    /* ── Main ── */
    .main { margin-left: 220px; flex: 1; display: flex; flex-direction: column; min-height: 100vh; }

    /* ── Topbar ── */
    .topbar {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 12px 24px;
      display: flex; align-items: center; justify-content: space-between;
      position: sticky; top: 0; z-index: 5;
    }
    .topbar-title { font-size: 15px; font-weight: 600; color: var(--t1); }
    .topbar-right { display: flex; align-items: center; gap: 12px; }
    .topbar-time { font-size: 12px; color: var(--t3); font-variant-numeric: tabular-nums; }

    /* ── Content ── */
    .content { padding: 24px; flex: 1; max-width: 1100px; }

    /* ── Cards ── */
    .card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 14px; padding: 20px 22px;
    }
    .card-title {
      font-size: 12px; font-weight: 600; color: var(--t3);
      letter-spacing: .06em; text-transform: uppercase;
      margin-bottom: 14px;
    }

    /* ── Stat tiles ── */
    .stats-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 20px; }
    .stat-tile {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 14px; padding: 18px 20px;
    }
    .stat-tile.accent { border-left: 3px solid var(--accent); }
    .stat-tile.success { border-left: 3px solid var(--success); }
    .stat-tile.warn    { border-left: 3px solid var(--warn); }
    .stat-tile.danger  { border-left: 3px solid var(--danger); }
    .stat-val  { font-size: 28px; font-weight: 800; color: var(--t1); line-height: 1; font-variant-numeric: tabular-nums; }
    .stat-lbl  { font-size: 12px; color: var(--t3); margin-top: 5px; }

    /* ── Grid 2 cols ── */
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 20px; }

    /* ── Tables ── */
    .tbl-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
    th { padding: 9px 14px; text-align: left; font-size: 11px; font-weight: 600;
         letter-spacing: .05em; text-transform: uppercase; color: var(--t3);
         border-bottom: 1px solid var(--border); white-space: nowrap; }
    td { padding: 10px 14px; color: var(--t2); border-bottom: 1px solid var(--border); vertical-align: middle; }
    tr:last-child td { border-bottom: none; }
    tbody tr:hover td { background: rgba(255,255,255,.025); }
    .tbl-link { color: var(--t1); text-decoration: none; font-weight: 500; }
    .tbl-link:hover { color: #25C97A; }

    /* ── Badges / pills ── */
    .pill {
      display: inline-block; font-size: 11px; font-weight: 600;
      padding: 2px 8px; border-radius: 20px; white-space: nowrap;
    }
    .pill-free      { background: rgba(148,163,184,.12); color: var(--t2); }
    .pill-premium   { background: rgba(245,158,11,.12);  color: var(--warn); }
    .pill-nutritionist { background: rgba(10,87,56,.15); color: #25C97A; }
    .pill-deleted   { background: rgba(239,68,68,.1); color: var(--danger); }
    .pill-ok        { background: rgba(16,185,129,.12); color: var(--success); }
    .pill-warn      { background: rgba(245,158,11,.12); color: var(--warn); }

    /* ── Buttons ── */
    .btn {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 7px 14px; border-radius: 8px; border: none;
      font-size: 13px; font-weight: 600; cursor: pointer;
      transition: opacity .15s; text-decoration: none;
    }
    .btn:hover { opacity: .85; }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-secondary { background: var(--card); color: var(--t2); border: 1px solid var(--border); }
    .btn-danger  { background: rgba(239,68,68,.15); color: var(--danger); border: 1px solid rgba(239,68,68,.25); }
    .btn-warn    { background: rgba(245,158,11,.12); color: var(--warn); border: 1px solid rgba(245,158,11,.2); }
    .btn-sm { padding: 4px 10px; font-size: 12px; border-radius: 6px; }

    /* ── Form elements ── */
    input[type="text"], input[type="search"], input[type="number"],
    select, textarea {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 8px; color: var(--t1); padding: 7px 12px;
      font-size: 13px; outline: none; width: 100%;
      transition: border-color .15s;
    }
    input:focus, select:focus { border-color: var(--accent); }
    label { font-size: 12px; color: var(--t3); margin-bottom: 4px; display: block; }

    /* ── Pagination ── */
    .pagination { display: flex; align-items: center; gap: 6px; margin-top: 16px; }
    .pg-btn {
      padding: 5px 12px; border-radius: 7px; font-size: 12.5px; font-weight: 600;
      border: 1px solid var(--border); background: var(--card); color: var(--t2);
      text-decoration: none; transition: background .15s;
    }
    .pg-btn:hover, .pg-btn.current { background: var(--accent-lt); color: #25C97A; }
    .pg-info { font-size: 12px; color: var(--t3); margin-left: 8px; }

    /* ── Alerts ── */
    .alert { padding: 10px 14px; border-radius: 8px; font-size: 13px; margin-bottom: 14px; }
    .alert-success { background: rgba(16,185,129,.12); color: var(--success); border: 1px solid rgba(16,185,129,.25); }
    .alert-danger  { background: rgba(239,68,68,.1);   color: var(--danger);  border: 1px solid rgba(239,68,68,.2); }

    /* ── Section label ── */
    .sect-label {
      font-size: 11px; font-weight: 600; letter-spacing: .07em;
      text-transform: uppercase; color: var(--t3);
      margin: 20px 0 12px; display: flex; align-items: center; gap: 8px;
    }
    .sect-label::before {
      content: ''; display: inline-block; width: 3px; height: 12px;
      background: var(--accent); border-radius: 2px;
    }

    /* ── Key-value list ── */
    .kv-list { display: grid; grid-template-columns: 160px 1fr; gap: 6px 12px; }
    .kv-key  { font-size: 12px; color: var(--t3); padding-top: 2px; }
    .kv-val  { font-size: 13.5px; color: var(--t1); word-break: break-all; }

    /* ── Inline toast ── */
    .toast {
      position: fixed; bottom: 20px; right: 20px; z-index: 100;
      background: var(--card); border: 1px solid var(--border);
      border-radius: 10px; padding: 12px 18px; font-size: 13px;
      box-shadow: 0 8px 24px rgba(0,0,0,.4);
      transform: translateY(80px); opacity: 0;
      transition: transform .25s, opacity .25s;
    }
    .toast.show { transform: translateY(0); opacity: 1; }
    .toast.ok   { border-left: 3px solid var(--success); color: var(--success); }
    .toast.err  { border-left: 3px solid var(--danger);  color: var(--danger); }

    /* ── Responsive ── */
    @media (max-width: 768px) {
      .sidebar { width: 100%; height: auto; position: relative; flex-direction: row; flex-wrap: wrap; }
      .main { margin-left: 0; }
      .stats-row { grid-template-columns: repeat(2, 1fr); }
      .grid-2 { grid-template-columns: 1fr; }
      .kv-list { grid-template-columns: 1fr; }
    }
    @media (max-width: 480px) {
      .stats-row { grid-template-columns: 1fr 1fr; }
      .content { padding: 14px; }
    }
  </style>
</head>
<body>
<div class="shell">

  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-brand">
      <div class="logo">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="22" height="22"><rect width="100" height="100" rx="22" fill="#0A5738"/><line x1="24" y1="70" x2="24" y2="40" stroke="white" stroke-width="12.5" stroke-linecap="round"/><path d="M 24 40 C 24 18 76 18 76 40" stroke="white" stroke-width="12.5" stroke-linecap="round" fill="none"/><line x1="76" y1="40" x2="76" y2="70" stroke="white" stroke-width="12.5" stroke-linecap="round"/><circle cx="50" cy="15" r="6" fill="#F0A318"/></svg>
        Nouri <span class="admin-badge">ADMIN</span>
      </div>
    </div>
    <nav class="sidebar-nav">
      <div class="nav-section-label">Principal</div>
      <a href="/admin" class="nav-link {% if active == 'dashboard' %}active{% endif %}">
        <span class="icon"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8"><path stroke-linecap="round" stroke-linejoin="round" d="M3 13.125C3 12.504 3.504 12 4.125 12h2.25c.621 0 1.125.504 1.125 1.125v6.75C7.5 20.496 6.996 21 6.375 21h-2.25A1.125 1.125 0 0 1 3 19.875v-6.75ZM9.75 8.625c0-.621.504-1.125 1.125-1.125h2.25c.621 0 1.125.504 1.125 1.125v11.25c0 .621-.504 1.125-1.125 1.125h-2.25a1.125 1.125 0 0 1-1.125-1.125V8.625ZM16.5 4.125c0-.621.504-1.125 1.125-1.125h2.25C20.496 3 21 3.504 21 4.125v15.75c0 .621-.504 1.125-1.125 1.125h-2.25a1.125 1.125 0 0 1-1.125-1.125V4.125Z"/></svg></span> Dashboard
      </a>
      <a href="/admin/usuarios" class="nav-link {% if active == 'usuarios' %}active{% endif %}">
        <span class="icon"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19.128a9.38 9.38 0 0 0 2.625.372 9.337 9.337 0 0 0 4.121-.952 4.125 4.125 0 0 0-7.533-2.493M15 19.128v-.003c0-1.113-.285-2.16-.786-3.07M15 19.128v.106A12.318 12.318 0 0 1 8.624 21c-2.331 0-4.512-.645-6.374-1.766l-.001-.109a6.375 6.375 0 0 1 11.964-3.07M12 6.375a3.375 3.375 0 1 1-6.75 0 3.375 3.375 0 0 1 6.75 0Zm8.25 2.25a2.625 2.625 0 1 1-5.25 0 2.625 2.625 0 0 1 5.25 0Z"/></svg></span> Usuários
      </a>
      <a href="/admin/assinaturas" class="nav-link {% if active == 'assinaturas' %}active{% endif %}">
        <span class="icon"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8"><path stroke-linecap="round" stroke-linejoin="round" d="M2.25 8.25h19.5M2.25 9h19.5m-16.5 5.25h6m-6 2.25h3m-3.75 3h15a2.25 2.25 0 0 0 2.25-2.25V6.75A2.25 2.25 0 0 0 19.5 4.5h-15a2.25 2.25 0 0 0-2.25 2.25v10.5A2.25 2.25 0 0 0 4.5 19.5Z"/></svg></span> Assinaturas
      </a>
      <div class="nav-section-label" style="margin-top:10px">Segmentos</div>
      <a href="/admin/b2c" class="nav-link {% if active == 'b2c' %}active{% endif %}">
        <span class="icon"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8"><path stroke-linecap="round" stroke-linejoin="round" d="M10.5 1.5H8.25A2.25 2.25 0 0 0 6 3.75v16.5a2.25 2.25 0 0 0 2.25 2.25h7.5A2.25 2.25 0 0 0 18 20.25V3.75a2.25 2.25 0 0 0-2.25-2.25H13.5m-3 0V3h3V1.5m-3 0h3m-3 18.75h3"/></svg></span> B2C (individual)
      </a>
      <div class="nav-section-label" style="margin-top:10px">B2B</div>
      <a href="/admin/nutricionistas" class="nav-link {% if active == 'nutricionistas' %}active{% endif %}">
        <span class="icon"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8"><path stroke-linecap="round" stroke-linejoin="round" d="M9 12h3.75M9 15h3.75M9 18h3.75m3 .75H18a2.25 2.25 0 0 0 2.25-2.25V6.108c0-1.135-.845-2.098-1.976-2.192a48.424 48.424 0 0 0-1.123-.08m-5.801 0c-.065.21-.1.433-.1.664 0 .414.336.75.75.75h4.5a.75.75 0 0 0 .75-.75 2.25 2.25 0 0 0-.1-.664m-5.8 0A2.251 2.251 0 0 1 13.5 2.25H15c1.012 0 1.867.668 2.15 1.586m-5.8 0c-.376.023-.75.05-1.124.08C9.095 4.01 8.25 4.973 8.25 6.108V8.25m0 0H4.875c-.621 0-1.125.504-1.125 1.125v11.25c0 .621.504 1.125 1.125 1.125h9.75c.621 0 1.125-.504 1.125-1.125V9.375c0-.621-.504-1.125-1.125-1.125H8.25ZM6.75 12h.008v.008H6.75V12Zm0 3h.008v.008H6.75V15Zm0 3h.008v.008H6.75V18Z"/></svg></span> Nutricionistas
      </a>
      <div class="nav-section-label" style="margin-top:10px">Sistema</div>
      <a href="/admin/logs" class="nav-link {% if active == 'logs' %}active{% endif %}">
        <span class="icon"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8"><path stroke-linecap="round" stroke-linejoin="round" d="M19.5 14.25v-2.625a3.375 3.375 0 0 0-3.375-3.375h-1.5A1.125 1.125 0 0 1 13.5 7.125v-1.5a3.375 3.375 0 0 0-3.375-3.375H8.25m0 12.75h7.5m-7.5 3H12M10.5 2.25H5.625c-.621 0-1.125.504-1.125 1.125v17.25c0 .621.504 1.125 1.125 1.125h12.75c.621 0 1.125-.504 1.125-1.125V11.25a9 9 0 0 0-9-9Z"/></svg></span> Logs de auditoria
      </a>
      <a href="/admin/health" class="nav-link {% if active == 'health' %}active{% endif %}">
        <span class="icon"><svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8"><path stroke-linecap="round" stroke-linejoin="round" d="M21 8.25c0-2.485-2.099-4.5-4.688-4.5-1.935 0-3.597 1.126-4.312 2.733-.715-1.607-2.377-2.733-4.313-2.733C5.1 3.75 3 5.765 3 8.25c0 7.22 9 12 9 12s9-4.78 9-12Z"/></svg></span> Health Check
      </a>
    </nav>
    <div class="sidebar-footer">
      <form action="/admin/logout" method="post">
        <button class="logout-btn" type="submit">
          <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.8"><path stroke-linecap="round" stroke-linejoin="round" d="M8.25 9V5.25A2.25 2.25 0 0 1 10.5 3h6a2.25 2.25 0 0 1 2.25 2.25v13.5A2.25 2.25 0 0 1 16.5 21h-6a2.25 2.25 0 0 1-2.25-2.25V15M12 9l3 3m0 0-3 3m3-3H2.25"/></svg> Sair
        </button>
      </form>
    </div>
  </aside>

  <!-- Main area -->
  <div class="main">
    <div class="topbar">
      <div class="topbar-title">{% block page_title %}Admin{% endblock %}</div>
      <div class="topbar-right">
        <span class="topbar-time" id="adminClock"></span>
        <span style="font-size:12px;color:var(--t3)">🔐 Sessão Admin</span>
      </div>
    </div>
    <div class="content">
      {% block content %}{% endblock %}
    </div>
  </div>

</div>

<!-- Toast global -->
<div class="toast" id="toast"></div>

<script>
// Relógio
function tick() {
  const el = document.getElementById('adminClock');
  if (el) el.textContent = new Date().toLocaleString('pt-BR', {timeZone:'America/Sao_Paulo', hour:'2-digit', minute:'2-digit', second:'2-digit'});
}
tick(); setInterval(tick, 1000);

// Toast helper
function showToast(msg, type='ok') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast ' + type + ' show';
  setTimeout(() => t.classList.remove('show'), 3500);
}

// Post helper (fetch JSON)
async function adminPost(url, body={}) {
  const fd = new FormData();
  Object.entries(body).forEach(([k,v]) => fd.append(k, v));
  const r = await fetch(url, { method: 'POST', body: fd });
  return r.json();
}
</script>
{% block scripts %}{% endblock %}
</body>
</html>
