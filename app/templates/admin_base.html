<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{% block title %}Admin{% endblock %} — NutriBot Admin</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg:      #0B1120;
      --surface: #111827;
      --card:    #1A2235;
      --border:  rgba(148,163,184,.1);
      --accent:  #6366F1;
      --accent-lt: rgba(99,102,241,.12);
      --danger:  #EF4444;
      --success: #10B981;
      --warn:    #F59E0B;
      --t1: #E2E8F0;
      --t2: #94A3B8;
      --t3: #475569;
      font-size: 14px;
    }
    body { background: var(--bg); color: var(--t1); font-family: system-ui, -apple-system, sans-serif; min-height: 100vh; }

    /* ── Layout shell ── */
    .shell { display: flex; min-height: 100vh; }

    /* ── Sidebar ── */
    .sidebar {
      width: 220px; flex-shrink: 0;
      background: var(--surface);
      border-right: 1px solid var(--border);
      display: flex; flex-direction: column;
      position: fixed; top: 0; left: 0; bottom: 0; z-index: 10;
    }
    .sidebar-brand {
      padding: 18px 16px 14px;
      border-bottom: 1px solid var(--border);
    }
    .sidebar-brand .logo {
      font-size: 15px; font-weight: 700; color: var(--t1);
      display: flex; align-items: center; gap: 8px;
    }
    .sidebar-brand .admin-badge {
      font-size: 9px; font-weight: 700; letter-spacing: .08em;
      text-transform: uppercase; background: var(--accent-lt);
      color: #A5B4FC; border: 1px solid rgba(99,102,241,.25);
      padding: 2px 6px; border-radius: 4px;
    }
    .sidebar-nav { flex: 1; padding: 12px 8px; overflow-y: auto; }
    .nav-section-label {
      font-size: 10px; font-weight: 600; color: var(--t3);
      letter-spacing: .08em; text-transform: uppercase;
      padding: 8px 10px 4px;
    }
    .nav-link {
      display: flex; align-items: center; gap: 10px;
      padding: 8px 10px; border-radius: 8px;
      color: var(--t2); text-decoration: none;
      font-size: 13.5px; transition: background .15s, color .15s;
      margin-bottom: 2px;
    }
    .nav-link:hover { background: var(--accent-lt); color: var(--t1); }
    .nav-link.active { background: var(--accent-lt); color: #A5B4FC; font-weight: 600; }
    .nav-link .icon { width: 18px; text-align: center; font-size: 15px; }
    .sidebar-footer {
      padding: 12px 8px;
      border-top: 1px solid var(--border);
    }
    .logout-btn {
      width: 100%; display: flex; align-items: center; gap: 10px;
      padding: 8px 10px; border-radius: 8px;
      background: none; border: none; cursor: pointer;
      color: var(--t3); font-size: 13px;
      transition: background .15s, color .15s;
    }
    .logout-btn:hover { background: rgba(239,68,68,.1); color: var(--danger); }

    /* ── Main ── */
    .main { margin-left: 220px; flex: 1; display: flex; flex-direction: column; min-height: 100vh; }

    /* ── Topbar ── */
    .topbar {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 12px 24px;
      display: flex; align-items: center; justify-content: space-between;
      position: sticky; top: 0; z-index: 5;
    }
    .topbar-title { font-size: 15px; font-weight: 600; color: var(--t1); }
    .topbar-right { display: flex; align-items: center; gap: 12px; }
    .topbar-time { font-size: 12px; color: var(--t3); font-variant-numeric: tabular-nums; }

    /* ── Content ── */
    .content { padding: 24px; flex: 1; max-width: 1100px; }

    /* ── Cards ── */
    .card {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 12px; padding: 20px 22px;
    }
    .card-title {
      font-size: 12px; font-weight: 600; color: var(--t3);
      letter-spacing: .06em; text-transform: uppercase;
      margin-bottom: 14px;
    }

    /* ── Stat tiles ── */
    .stats-row { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; margin-bottom: 20px; }
    .stat-tile {
      background: var(--card); border: 1px solid var(--border);
      border-radius: 12px; padding: 18px 20px;
    }
    .stat-tile.accent { border-left: 3px solid var(--accent); }
    .stat-tile.success { border-left: 3px solid var(--success); }
    .stat-tile.warn    { border-left: 3px solid var(--warn); }
    .stat-tile.danger  { border-left: 3px solid var(--danger); }
    .stat-val  { font-size: 28px; font-weight: 800; color: var(--t1); line-height: 1; font-variant-numeric: tabular-nums; }
    .stat-lbl  { font-size: 12px; color: var(--t3); margin-top: 5px; }

    /* ── Grid 2 cols ── */
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 20px; }

    /* ── Tables ── */
    .tbl-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
    th { padding: 9px 14px; text-align: left; font-size: 11px; font-weight: 600;
         letter-spacing: .05em; text-transform: uppercase; color: var(--t3);
         border-bottom: 1px solid var(--border); white-space: nowrap; }
    td { padding: 10px 14px; color: var(--t2); border-bottom: 1px solid var(--border); vertical-align: middle; }
    tr:last-child td { border-bottom: none; }
    tbody tr:hover td { background: rgba(255,255,255,.025); }
    .tbl-link { color: var(--t1); text-decoration: none; font-weight: 500; }
    .tbl-link:hover { color: #A5B4FC; }

    /* ── Badges / pills ── */
    .pill {
      display: inline-block; font-size: 11px; font-weight: 600;
      padding: 2px 8px; border-radius: 20px; white-space: nowrap;
    }
    .pill-free      { background: rgba(148,163,184,.12); color: var(--t2); }
    .pill-premium   { background: rgba(245,158,11,.12);  color: var(--warn); }
    .pill-nutritionist { background: rgba(99,102,241,.15); color: #A5B4FC; }
    .pill-deleted   { background: rgba(239,68,68,.1); color: var(--danger); }
    .pill-ok        { background: rgba(16,185,129,.12); color: var(--success); }
    .pill-warn      { background: rgba(245,158,11,.12); color: var(--warn); }

    /* ── Buttons ── */
    .btn {
      display: inline-flex; align-items: center; gap: 6px;
      padding: 7px 14px; border-radius: 8px; border: none;
      font-size: 13px; font-weight: 600; cursor: pointer;
      transition: opacity .15s; text-decoration: none;
    }
    .btn:hover { opacity: .85; }
    .btn-primary { background: var(--accent); color: #fff; }
    .btn-secondary { background: var(--card); color: var(--t2); border: 1px solid var(--border); }
    .btn-danger  { background: rgba(239,68,68,.15); color: var(--danger); border: 1px solid rgba(239,68,68,.25); }
    .btn-warn    { background: rgba(245,158,11,.12); color: var(--warn); border: 1px solid rgba(245,158,11,.2); }
    .btn-sm { padding: 4px 10px; font-size: 12px; border-radius: 6px; }

    /* ── Form elements ── */
    input[type="text"], input[type="search"], input[type="number"],
    select, textarea {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 8px; color: var(--t1); padding: 7px 12px;
      font-size: 13px; outline: none; width: 100%;
      transition: border-color .15s;
    }
    input:focus, select:focus { border-color: var(--accent); }
    label { font-size: 12px; color: var(--t3); margin-bottom: 4px; display: block; }

    /* ── Pagination ── */
    .pagination { display: flex; align-items: center; gap: 6px; margin-top: 16px; }
    .pg-btn {
      padding: 5px 12px; border-radius: 7px; font-size: 12.5px; font-weight: 600;
      border: 1px solid var(--border); background: var(--card); color: var(--t2);
      text-decoration: none; transition: background .15s;
    }
    .pg-btn:hover, .pg-btn.current { background: var(--accent-lt); color: #A5B4FC; }
    .pg-info { font-size: 12px; color: var(--t3); margin-left: 8px; }

    /* ── Alerts ── */
    .alert { padding: 10px 14px; border-radius: 8px; font-size: 13px; margin-bottom: 14px; }
    .alert-success { background: rgba(16,185,129,.12); color: var(--success); border: 1px solid rgba(16,185,129,.25); }
    .alert-danger  { background: rgba(239,68,68,.1);   color: var(--danger);  border: 1px solid rgba(239,68,68,.2); }

    /* ── Section label ── */
    .sect-label {
      font-size: 11px; font-weight: 600; letter-spacing: .07em;
      text-transform: uppercase; color: var(--t3);
      margin: 20px 0 12px; display: flex; align-items: center; gap: 8px;
    }
    .sect-label::before {
      content: ''; display: inline-block; width: 3px; height: 12px;
      background: var(--accent); border-radius: 2px;
    }

    /* ── Key-value list ── */
    .kv-list { display: grid; grid-template-columns: 160px 1fr; gap: 6px 12px; }
    .kv-key  { font-size: 12px; color: var(--t3); padding-top: 2px; }
    .kv-val  { font-size: 13.5px; color: var(--t1); word-break: break-all; }

    /* ── Inline toast ── */
    .toast {
      position: fixed; bottom: 20px; right: 20px; z-index: 100;
      background: var(--card); border: 1px solid var(--border);
      border-radius: 10px; padding: 12px 18px; font-size: 13px;
      box-shadow: 0 8px 24px rgba(0,0,0,.4);
      transform: translateY(80px); opacity: 0;
      transition: transform .25s, opacity .25s;
    }
    .toast.show { transform: translateY(0); opacity: 1; }
    .toast.ok   { border-left: 3px solid var(--success); color: var(--success); }
    .toast.err  { border-left: 3px solid var(--danger);  color: var(--danger); }

    /* ── Responsive ── */
    @media (max-width: 768px) {
      .sidebar { width: 100%; height: auto; position: relative; flex-direction: row; flex-wrap: wrap; }
      .main { margin-left: 0; }
      .stats-row { grid-template-columns: repeat(2, 1fr); }
      .grid-2 { grid-template-columns: 1fr; }
      .kv-list { grid-template-columns: 1fr; }
    }
    @media (max-width: 480px) {
      .stats-row { grid-template-columns: 1fr 1fr; }
      .content { padding: 14px; }
    }
  </style>
</head>
<body>
<div class="shell">

  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-brand">
      <div class="logo">
        🥦 NutriBot <span class="admin-badge">ADMIN</span>
      </div>
    </div>
    <nav class="sidebar-nav">
      <div class="nav-section-label">Principal</div>
      <a href="/admin" class="nav-link {% if active == 'dashboard' %}active{% endif %}">
        <span class="icon">📊</span> Dashboard
      </a>
      <a href="/admin/usuarios" class="nav-link {% if active == 'usuarios' %}active{% endif %}">
        <span class="icon">👥</span> Usuários
      </a>
      <div class="nav-section-label" style="margin-top:10px">Sistema</div>
      <a href="/admin/logs" class="nav-link {% if active == 'logs' %}active{% endif %}">
        <span class="icon">📋</span> Logs de auditoria
      </a>
      <a href="/health" target="_blank" class="nav-link"
         title="Status do servidor (nova aba)">
        <span class="icon">🩺</span> Health Check
      </a>
    </nav>
    <div class="sidebar-footer">
      <form action="/admin/logout" method="post">
        <button class="logout-btn" type="submit">
          <span>↩️</span> Sair
        </button>
      </form>
    </div>
  </aside>

  <!-- Main area -->
  <div class="main">
    <div class="topbar">
      <div class="topbar-title">{% block page_title %}Admin{% endblock %}</div>
      <div class="topbar-right">
        <span class="topbar-time" id="adminClock"></span>
        <span style="font-size:12px;color:var(--t3)">🔐 Sessão Admin</span>
      </div>
    </div>
    <div class="content">
      {% block content %}{% endblock %}
    </div>
  </div>

</div>

<!-- Toast global -->
<div class="toast" id="toast"></div>

<script>
// Relógio
function tick() {
  const el = document.getElementById('adminClock');
  if (el) el.textContent = new Date().toLocaleString('pt-BR', {timeZone:'America/Sao_Paulo', hour:'2-digit', minute:'2-digit', second:'2-digit'});
}
tick(); setInterval(tick, 1000);

// Toast helper
function showToast(msg, type='ok') {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast ' + type + ' show';
  setTimeout(() => t.classList.remove('show'), 3500);
}

// Post helper (fetch JSON)
async function adminPost(url, body={}) {
  const fd = new FormData();
  Object.entries(body).forEach(([k,v]) => fd.append(k, v));
  const r = await fetch(url, { method: 'POST', body: fd });
  return r.json();
}
</script>
{% block scripts %}{% endblock %}
</body>
</html>
