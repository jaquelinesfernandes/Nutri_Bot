{% extends "base.html" %}
{% block title %}Criar conta — NutriBot{% endblock %}
{% block body %}
<div class="min-h-screen flex items-center justify-center bg-gradient-to-br from-green-50 to-slate-100 px-4 py-8">
  <div class="w-full max-w-md">
    <div class="text-center mb-8">
      <div class="text-5xl mb-3">🥗</div>
      <h1 class="text-3xl font-bold text-slate-800">NutriBot</h1>
      <p class="text-slate-500 mt-1">Crie sua conta gratuitamente</p>
    </div>

    <div class="bg-white rounded-2xl shadow-lg p-8">
      <h2 class="text-xl font-semibold text-slate-700 mb-6">Criar conta</h2>

      {% if error %}
      <div class="mb-4 px-4 py-3 bg-red-50 border border-red-200 rounded-lg text-red-700 text-sm">
        {{ error }}
      </div>
      {% endif %}

      <form method="post" action="/auth/register-form" class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-slate-600 mb-1">Nome</label>
          <input type="text" name="name" required
            class="w-full px-4 py-2.5 border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-brand-500 text-sm"/>
        </div>
        <div>
          <label class="block text-sm font-medium text-slate-600 mb-1">E-mail</label>
          <input type="email" name="email" required autocomplete="email"
            class="w-full px-4 py-2.5 border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-brand-500 text-sm"/>
        </div>
        <div>
          <label class="block text-sm font-medium text-slate-600 mb-1">Senha</label>
          <input type="password" name="password" required minlength="6" autocomplete="new-password"
            class="w-full px-4 py-2.5 border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-brand-500 text-sm"/>
          <p class="text-xs text-slate-400 mt-1">Mínimo 6 caracteres</p>
        </div>
        <div>
          <label class="block text-sm font-medium text-slate-600 mb-1">
            Meta calórica diária <span class="text-slate-400">(opcional)</span>
          </label>
          <input type="number" name="daily_calorie_goal" min="800" max="5000" placeholder="ex: 2000"
            class="w-full px-4 py-2.5 border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-brand-500 text-sm"/>
        </div>
        <button type="submit"
          class="w-full bg-brand-600 hover:bg-brand-700 text-white font-semibold py-2.5 rounded-lg transition-colors text-sm">
          Criar conta
        </button>
      </form>

      <p class="mt-6 text-center text-sm text-slate-500">
        Já tem conta?
        <a href="/login" class="text-brand-600 hover:underline font-medium">Entrar</a>
      </p>
    </div>
  </div>
</div>
{% endblock %}
