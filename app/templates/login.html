{% extends "base.html" %}
{% block title %}Entrar — NutriBot{% endblock %}
{% block body %}
<div class="min-h-screen flex items-center justify-center bg-gradient-to-br from-green-50 to-slate-100 px-4">
  <div class="w-full max-w-md">
    <div class="text-center mb-8">
      <div class="text-5xl mb-3">🥗</div>
      <h1 class="text-3xl font-bold text-slate-800">NutriBot</h1>
      <p class="text-slate-500 mt-1">Acompanhamento nutricional inteligente</p>
    </div>

    <div class="bg-white rounded-2xl shadow-lg p-8">
      <h2 class="text-xl font-semibold text-slate-700 mb-6">Entrar na plataforma</h2>

      {% if error %}
      <div class="mb-4 px-4 py-3 bg-red-50 border border-red-200 rounded-lg text-red-700 text-sm">
        {{ error }}
      </div>
      {% endif %}

      <form method="post" action="/auth/login-form" class="space-y-4">
        <div>
          <label class="block text-sm font-medium text-slate-600 mb-1">E-mail</label>
          <input type="email" name="email" required autocomplete="email"
            class="w-full px-4 py-2.5 border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-brand-500 text-sm"/>
        </div>
        <div>
          <label class="block text-sm font-medium text-slate-600 mb-1">Senha</label>
          <input type="password" name="password" required autocomplete="current-password"
            class="w-full px-4 py-2.5 border border-gray-200 rounded-lg focus:outline-none focus:ring-2 focus:ring-brand-500 text-sm"/>
        </div>
        <button type="submit"
          class="w-full bg-brand-600 hover:bg-brand-700 text-white font-semibold py-2.5 rounded-lg transition-colors text-sm">
          Entrar
        </button>
      </form>

      <p class="mt-6 text-center text-sm text-slate-500">
        Não tem conta?
        <a href="/cadastro" class="text-brand-600 hover:underline font-medium">Criar conta</a>
      </p>
    </div>

    <p class="text-center text-xs text-slate-400 mt-6">
      Também disponível no
      <a href="https://t.me/NutriBotOficialBot" class="underline">Telegram</a>
    </p>
  </div>
</div>
{% endblock %}
