<!doctype html>
<html lang="pt-BR" class="h-full">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover"/>
  <title>{% block title %}Nouri{% endblock %}</title>

  <!-- PWA -->
  <link rel="manifest" href="/static/manifest.json"/>
  <meta name="theme-color" content="#0A5738"/>
  <meta name="mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="apple-mobile-web-app-title" content="Nouri"/>
  <link rel="icon" href="/static/icon.svg" type="image/svg+xml"/>
  <link rel="icon" type="image/png" sizes="192x192" href="/static/icon-192.png"/>
  <link rel="apple-touch-icon" href="/static/icon-192.png"/>

  <!-- Tailwind CDN — mantido para páginas legadas (historico, configuracoes, etc.) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: { extend: { colors: { brand: { 500:'#25C97A', 600:'#0A5738', 700:'#07402A' } } } }
    }
  </script>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,400;0,600;0,700;1,400&family=Plus+Jakarta+Sans:wght@400;500;600&family=DM+Mono:wght@400;500&family=DM+Serif+Display:ital@0;1&display=swap">

  <style>
  /* ── Design tokens — Nouri Green (light only) ─────────── */
  :root {
    color-scheme: light;
    --primary:      #0A5738;
    --primary-d:    #07402A;
    --primary-lt:   #E8F5EE;
    --violet:       #25C97A;
    --violet-lt:    #E8F5EE;
    --cyan:         #F0A318;
    --cyan-lt:      #FEF3DC;
    --sidebar-bg:   #FFFFFF;
    --sidebar-hov:  #F0F7F4;
    --sidebar-act:  rgba(37,201,122,.12);
    --surface:      #F0F7F3;
    --card:         #FFFFFF;
    --card-b:       rgba(10,87,56,.1);
    --text-1:       #0D2A1A;
    --text-2:       #3D6B52;
    --text-3:       #7BA88A;
    --prot-c:       #0A5738;
    --prot-lt:      #E8F5EE;
    --carb-c:       #0A8F56;
    --carb-lt:      #E8F5EE;
    --fat-c:        #B87310;
    --fat-lt:       #FEF3DC;
    --ok-c:         #0A5738;
    --warn-c:       #F59E0B;
    --over-c:       #EF4444;
    --shadow-sm:    0 1px 3px rgba(10,87,56,.08), 0 1px 2px rgba(10,87,56,.05);
    --shadow-md:    0 4px 20px rgba(10,87,56,.1), 0 1px 6px rgba(10,87,56,.06);
  }

  /* ── Reset ──────────────────────────────────────────── */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { height: 100%; }
  html body {
    font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
    background: var(--surface);
    color: var(--text-1);
    font-size: 14px;
    line-height: 1.5;
    height: 100%;
  }

  /* ── App shell ──────────────────────────────────────── */
  .app { display: flex; height: 100%; min-height: 100vh; }

  /* ── Sidebar ────────────────────────────────────────── */
  .sidebar {
    width: 220px;
    background: var(--sidebar-bg);
    display: flex; flex-direction: column; flex-shrink: 0;
    position: sticky; top: 0; height: 100vh; overflow: hidden;
  }
  .sb-logo {
    display: flex; align-items: center; gap: 10px;
    padding: 22px 20px 18px;
    border-bottom: 1px solid rgba(10,87,56,.1);
  }
  .sb-leaf {
    width: 32px; height: 32px;
    background: var(--primary);
    border-radius: 9px; display: grid; place-items: center;
    flex-shrink: 0;
  }
  .sb-brand { font-family: 'Lora', Georgia, serif; font-weight: 700; font-size: 15px; color: var(--text-1); letter-spacing: -.15px; }
  .sb-nav { flex: 1; padding: 14px 10px; display: flex; flex-direction: column; gap: 2px; }
  .sb-sect {
    font-size: 10px; font-weight: 600; letter-spacing: .09em;
    text-transform: uppercase; color: rgba(10,87,56,.4);
    padding: 8px 10px 4px;
  }
  .sb-link {
    display: flex; align-items: center; gap: 10px;
    padding: 9px 10px; border-radius: 8px;
    font-size: 13.5px; font-weight: 500; color: rgba(10,87,56,.55);
    transition: background .15s, color .15s;
    border-left: 3px solid transparent; cursor: pointer;
    text-decoration: none;
  }
  .sb-link:hover { background: var(--sidebar-hov); color: var(--text-1); }
  .sb-link.active { background: rgba(10,87,56,.08); color: var(--primary); border-left-color: var(--primary); }
  .sb-icon { width: 17px; height: 17px; flex-shrink: 0; opacity: .7; }
  .sb-link.active .sb-icon { opacity: 1; }
  .sb-foot { padding: 12px 10px; border-top: 1px solid rgba(10,87,56,.1); }
  .sb-user { display: flex; align-items: center; gap: 9px; padding: 7px 10px; margin-bottom: 2px; }
  .sb-avatar {
    width: 28px; height: 28px; border-radius: 50%;
    background: linear-gradient(135deg, var(--primary), var(--violet));
    display: grid; place-items: center;
    font-size: 12px; font-weight: 600; color: #fff; flex-shrink: 0;
  }
  .sb-username {
    font-size: 12.5px; font-weight: 500; color: var(--text-2);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .sb-logout {
    display: flex; align-items: center; gap: 10px;
    width: 100%; padding: 8px 10px; border-radius: 8px;
    background: none; border: none; cursor: pointer;
    font-size: 13px; color: rgba(10,87,56,.4); font-family: inherit;
    transition: background .15s, color .15s;
  }
  .sb-logout:hover { background: var(--sidebar-hov); color: var(--text-1); }

  /* ── Mobile bottom nav ──────────────────────────────── */
  .mobile-nav {
    display: none; position: fixed; bottom: 0; left: 0; right: 0;
    background: var(--sidebar-bg); border-top: 1px solid rgba(10,87,56,.1);
    z-index: 50; padding: 0 4px env(safe-area-inset-bottom, 0);
  }
  .mobile-nav-inner { display: flex; justify-content: space-around; align-items: stretch; }
  .mob-link {
    flex: 1; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 3px; padding: 10px 4px;
    color: rgba(10,87,56,.4); font-size: 10px; font-weight: 500;
    cursor: pointer; transition: color .15s; border: none; background: none; font-family: inherit;
  }
  .mob-link.active { color: var(--primary); }
  .mob-link svg { width: 20px; height: 20px; }

  /* ── Main content ───────────────────────────────────── */
  .main { flex: 1; overflow-y: auto; min-width: 0; }
  .inner { max-width: 1080px; margin: 0 auto; padding: 28px 24px 40px; }

  /* ── Page header ────────────────────────────────────── */
  .pg-header {
    display: flex; align-items: flex-start;
    justify-content: space-between; gap: 12px; margin-bottom: 24px;
  }
  .greeting {
    font-family: 'Lora', Georgia, serif;
    font-weight: 700; font-size: 26px; line-height: 1.2; color: var(--text-1); text-wrap: balance;
  }
  .greeting em { font-style: normal; color: var(--primary); }
  .today-date { font-size: 12.5px; color: var(--text-3); margin-top: 4px; }
  .status-pill {
    display: flex; align-items: center; gap: 6px;
    padding: 6px 12px; background: var(--card);
    border: 1px solid var(--card-b); border-radius: 20px;
    font-size: 12px; color: var(--text-2); box-shadow: var(--shadow-sm);
    flex-shrink: 0; white-space: nowrap;
  }
  .dot-live { width: 7px; height: 7px; border-radius: 50%; background: #4CAF50; }

  /* ── Section label ──────────────────────────────────── */
  .sect-label {
    display: flex; align-items: center; gap: 8px;
    font-size: 11px; font-weight: 600; letter-spacing: .07em;
    text-transform: uppercase; color: var(--text-3);
    margin-bottom: 12px; margin-top: 28px;
  }
  .sect-label::before {
    content: ''; display: inline-block; width: 3px; height: 12px;
    background: linear-gradient(to bottom, var(--primary), var(--violet));
    border-radius: 2px; flex-shrink: 0;
  }

  /* ── Card base ──────────────────────────────────────── */
  .card {
    background: var(--card); border-radius: 20px;
    box-shadow: 0 2px 8px rgba(10,87,56,.07), 0 8px 24px rgba(10,87,56,.05);
    border: 1px solid var(--card-b);
    transition: box-shadow .2s ease, transform .2s ease;
  }
  .card:hover {
    box-shadow: 0 4px 14px rgba(10,87,56,.13), 0 12px 32px rgba(10,87,56,.09);
    transform: translateY(-1px);
  }
  .card-pad { padding: 22px; }
  .card-title {
    font-size: 13px; font-weight: 600; color: var(--text-2);
    margin-bottom: 18px; display: flex; align-items: center; justify-content: space-between;
  }
  .chip { font-size: 11px; font-weight: 500; padding: 3px 9px; border-radius: 20px; }
  .chip-sage  { background: var(--primary-lt); color: var(--primary); }
  .chip-amber { background: var(--violet-lt);  color: var(--violet); }

  /* ── S1: Today overview ─────────────────────────────── */
  .today-grid {
    display: flex; flex-direction: column;
    gap: 14px;
  }
  .hero-row {
    display: grid; grid-template-columns: 1fr 1fr;
    gap: 14px; align-items: stretch;
  }
  .macro-row {
    display: grid; grid-template-columns: repeat(4, 1fr);
    gap: 10px;
  }
  .macro-row .macro-card { padding: 12px 14px; }

  /* Cards — Calorias + Macros (neumorphic light) */
  .ring-card, .macro-card {
    background: #FFFFFF;
    border: none;
    box-shadow:
      5px 5px 16px rgba(10,87,56,.08),
      -5px -5px 16px rgba(255,255,255,.9),
      0 1px 3px rgba(10,87,56,.04);
  }
  .ring-card:hover, .macro-card:hover {
    box-shadow:
      7px 7px 20px rgba(10,87,56,.11),
      -7px -7px 20px rgba(255,255,255,.95),
      0 2px 6px rgba(10,87,56,.06);
    transform: translateY(-2px);
  }

  .ring-card {
    display: flex; flex-direction: column; align-items: center;
    padding: 24px 20px 22px; position: relative; overflow: hidden;
  }
  .ring-card::before {
    content: ''; position: absolute; bottom: -30px; left: -30px;
    width: 160px; height: 160px;
    background: radial-gradient(circle, rgba(10,87,56,.06) 0%, transparent 70%);
    border-radius: 50%; pointer-events: none;
  }
  .ring-card::after {
    content: ''; position: absolute; top: -20px; right: -20px;
    width: 110px; height: 110px;
    background: radial-gradient(circle, rgba(37,201,122,.07) 0%, transparent 70%);
    border-radius: 50%; pointer-events: none;
  }
  .ring-eyebrow {
    align-self: flex-start; font-size: 10.5px; font-weight: 600;
    letter-spacing: .07em; text-transform: uppercase;
    color: var(--text-3); margin-bottom: 16px;
  }
  .ring-wrap { position: relative; width: 160px; height: 160px; margin-bottom: 16px; }
  .ring-wrap svg { transform: rotate(-90deg); display: block; }
  .r-track { fill: none; stroke: rgba(10,87,56,.08); stroke-width: 12; }
  .r-fill  { fill: none; stroke-width: 12; stroke-linecap: round; }
  .r-fill-ok   { stroke: url(#ringGrad); }
  .r-fill-warn { stroke: #FBBF24; }
  .r-fill-over { stroke: #F87171; }
  .ring-center {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 2px;
  }
  .ring-big {
    font-family: 'Lora', Georgia, serif;
    font-weight: 700; font-size: 32px; line-height: 1; color: var(--text-1);
  }
  .ring-of { font-size: 11px; color: var(--text-3); margin-top: 3px; }
  .ring-pct { font-size: 12.5px; font-weight: 700; color: #0A5738; margin-top: 2px; }
  .ring-info { display: flex; flex-direction: column; gap: 8px; }
  .ring-remain {
    font-size: 12.5px; color: var(--text-2);
    display: flex; align-items: center; gap: 7px;
  }
  .remain-chip {
    background: var(--primary-lt); color: #0A5738;
    padding: 3px 10px; border-radius: 20px;
    font-size: 12px; font-weight: 600; border: 1px solid rgba(10,87,56,.2);
  }
  .ring-tip {
    margin-top: 4px; font-size: 11.5px; color: var(--text-3);
    text-align: center; font-style: italic;
  }

  .macro-stack { display: flex; flex-direction: column; gap: 10px; }
  .macro-card {
    display: flex; align-items: center; gap: 14px;
    padding: 15px 18px; flex: 1;
    transition: box-shadow .2s ease, transform .2s ease;
  }
  .macro-icon {
    width: 36px; height: 36px; border-radius: 10px;
    display: grid; place-items: center; font-size: 17px; flex-shrink: 0;
  }
  .macro-icon.prot  { background: var(--prot-lt); }
  .macro-icon.carb  { background: var(--carb-lt); }
  .macro-icon.fat   { background: var(--fat-lt); }
  .macro-icon.fiber { background: #E8F5EE; }
  .macro-body { flex: 1; min-width: 0; }
  .macro-lbl {
    font-size: 10.5px; font-weight: 600; letter-spacing: .06em;
    text-transform: uppercase; color: var(--text-3); margin-bottom: 2px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .macro-num {
    font-family: 'Lora', Georgia, serif;
    font-weight: 700; font-size: 24px; line-height: 1; color: var(--text-1);
  }
  .macro-num small {
    font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
    font-size: 12px; color: var(--text-3); font-style: normal;
  }
  .macro-sub { font-size: 11.5px; color: var(--text-2); margin-top: 3px; }
  .macro-mini-track {
    height: 4px; border-radius: 2px; background: rgba(10,87,56,.08);
    margin-top: 7px; overflow: hidden;
  }
  .macro-mini-fill { height: 100%; border-radius: 2px; }
  .macro-spark { width: 56px; height: 30px; flex-shrink: 0; overflow: visible; }

  /* ── Water hero card ─────────────────────────────────── */
  .water-hero-card {
    display: flex; flex-direction: column; align-items: center;
    padding: 24px 22px 22px; text-align: center;
  }
  .water-eyebrow-lbl {
    font-size: 10.5px; font-weight: 600; letter-spacing: .07em;
    text-transform: uppercase; color: var(--text-3); margin-bottom: 14px;
  }
  .water-big-num {
    font-family: 'DM Mono', monospace;
    font-weight: 500; font-size: 40px; line-height: 1; color: var(--text-1);
    font-variant-numeric: tabular-nums;
  }
  .water-big-num small {
    font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
    font-size: 17px; color: var(--text-3); font-style: normal; margin-left: 2px;
  }
  .water-goal-sub {
    font-size: 12.5px; color: var(--text-2); margin-top: 6px;
  }
  .water-full-bar {
    width: calc(100% - 44px); height: 10px; border-radius: 5px;
    background: rgba(10,87,56,.08); margin: 16px 0 6px; overflow: hidden;
  }
  .water-full-fill {
    height: 100%; border-radius: 5px;
    background: linear-gradient(90deg, #0A5738, #25C97A);
    transition: width .4s ease;
  }
  .water-status-label {
    font-size: 12px; color: var(--text-3);
    font-style: italic; margin-bottom: 16px;
  }

  /* ── S2: 7-day chart ────────────────────────────────── */
  .week-pct-canvas { width: 100%; height: 200px; display: block; }

  /* ── S3: Historical + macro % ────────────────────────── */
  .insights-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .insights-grid > .card { display: flex; flex-direction: column; }
  .insights-grid + .insights-grid { margin-top: 14px; }

  .hist-stats {
    display: grid; grid-template-columns: repeat(4, 1fr);
    gap: 8px; margin-bottom: 18px;
  }
  .stat-box {
    background: var(--primary-lt); border-radius: 12px;
    padding: 14px 10px 12px;
    border: 1px solid rgba(10,87,56,.1); border-top: 3px solid transparent;
  }
  .stat-box.good  { border-top-color: #0A5738; }
  .stat-box.warn  { border-top-color: #EF4444; }
  .stat-box.amber { border-top-color: #25C97A; }
  .stat-box.best  { border-top-color: #F0A318; }
  .stat-top { display: flex; align-items: baseline; gap: 4px; flex-wrap: wrap; }
  .stat-val {
    font-family: 'Lora', Georgia, serif;
    font-weight: 700; font-size: 24px; color: var(--text-1); line-height: 1;
  }
  .stat-trend {
    font-size: 10px; font-weight: 700; padding: 1px 5px; border-radius: 20px; white-space: nowrap;
  }
  .stat-trend.up   { color: #0A5738; background: rgba(10,87,56,.12); }
  .stat-trend.down { color: #EF4444; background: rgba(239,68,68,.1); }
  .stat-trend.sky  { color: #25C97A; background: rgba(37,201,122,.1); }
  .stat-lbl { font-size: 10.5px; color: var(--text-3); margin-top: 5px; line-height: 1.35; }

  .hist-chart-wrap { flex: 1; display: flex; flex-direction: column; min-height: 80px; }
  .mini-hist-label {
    font-size: 11px; font-weight: 600; letter-spacing: .05em;
    text-transform: uppercase; color: var(--text-3); margin-bottom: 8px;
  }
  .mini-hist { width: 100%; flex: 1; min-height: 64px; display: block; }

  .mprog-compare {
    flex: 1; display: flex; flex-direction: column;
    justify-content: flex-start; gap: 0;
  }
  .mprog-item { padding: 14px 0; }
  .mprog-item:not(:last-child) { border-bottom: 1px solid var(--card-b); }
  .mprog-head {
    display: flex; justify-content: space-between; align-items: center;
    font-size: 12.5px; margin-bottom: 10px;
  }
  .mprog-name { font-weight: 600; display: flex; align-items: center; gap: 6px; color: var(--text-1); }
  .mprog-dot  { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .mprog-meta { font-size: 11px; color: var(--text-3); font-variant-numeric: tabular-nums; }
  .mprog-tracks { display: flex; flex-direction: column; gap: 5px; }
  .mprog-row { display: flex; align-items: center; gap: 8px; }
  .mprog-row-label {
    font-size: 10px; font-weight: 600; letter-spacing: .04em;
    text-transform: uppercase; color: var(--text-3);
    width: 32px; flex-shrink: 0; text-align: right;
  }
  .mprog-track { flex: 1; border-radius: 5px; background: rgba(10,87,56,.08); overflow: hidden; }
  .mprog-track.today { height: 9px; }
  .mprog-track.avg   { height: 6px; }
  .mprog-fill {
    height: 100%; border-radius: 5px;
    transition: width .6s cubic-bezier(.16,1,.3,1);
  }
  .mprog-pct {
    font-family: 'DM Mono', monospace; font-size: 11.5px;
    font-variant-numeric: tabular-nums;
    width: 32px; text-align: right; flex-shrink: 0; color: var(--text-2);
  }
  .mprog-pct.dim { color: var(--text-3); font-size: 10.5px; }
  .mprog-legend {
    display: flex; gap: 16px; align-items: center;
    margin-top: 6px; padding-top: 14px; border-top: 1px solid var(--card-b);
  }
  .mprog-legend-item { display: flex; align-items: center; gap: 5px; font-size: 11px; color: var(--text-3); }
  .mprog-legend-swatch { border-radius: 2px; flex-shrink: 0; }

  /* ── Meals ──────────────────────────────────────────── */
  .meals-list { display: flex; flex-direction: column; }
  .meal-row {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 10px; border-radius: 12px;
    transition: background .15s; margin: 0 -10px;
  }
  .meal-row:hover { background: rgba(10,87,56,.04); }
  .meal-sep { height: 1px; background: var(--card-b); margin: 0; }
  .meal-color-bar { width: 3px; height: 38px; border-radius: 2px; flex-shrink: 0; }
  .meal-inf { flex: 1; min-width: 0; }
  .meal-name { font-size: 13px; font-weight: 600; color: var(--text-1); }
  .meal-foods {
    font-size: 11.5px; color: var(--text-3);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px;
  }
  .meal-time {
    font-family: 'DM Mono', monospace; font-size: 11px; color: var(--text-3);
    background: rgba(10,87,56,.07); padding: 2px 7px; border-radius: 6px;
    flex-shrink: 0; font-variant-numeric: tabular-nums;
  }
  .meal-kcal {
    font-family: 'DM Mono', monospace; font-size: 13px; font-weight: 500;
    color: var(--text-2); flex-shrink: 0; font-variant-numeric: tabular-nums;
    min-width: 62px; text-align: right;
  }
  .no-meals { text-align: center; padding: 32px 0; }
  .no-meals .icon { display: flex; justify-content: center; margin-bottom: 12px; color: var(--card-b); }
  .no-meals p { font-size: 13px; color: var(--text-2); }
  .no-meals small { font-size: 12px; color: var(--text-3); display: block; margin-top: 4px; }

  /* ── Responsive ─────────────────────────────────────── */
  @media (max-width: 860px) {
    .insights-grid { grid-template-columns: 1fr; }
    .stat-box { padding: 12px 8px 10px; }
    .stat-val { font-size: 21px; }
    /* macro-row: 4 colunas ficam estreitas (~105-140px) quando sidebar está visível */
    .macro-row { grid-template-columns: repeat(2, 1fr); }
    .macro-row .macro-card { padding: 14px 16px; }
  }
  @media (max-width: 720px) {
    .hero-row { grid-template-columns: 1fr; }
    .macro-row { grid-template-columns: repeat(2, 1fr); }
    .ring-card { flex-direction: row; gap: 20px; padding: 18px; align-items: center; }
    .ring-card::after { display: none; }
    .ring-eyebrow { display: none; }
    .ring-wrap { width: 120px; height: 120px; flex-shrink: 0; margin-bottom: 0; overflow: hidden; }
    .ring-big { font-size: 24px; }
    .ring-remain { flex-direction: column; align-items: flex-start; gap: 4px; }
    /* water-hero-card: overrides ring-card row-direction para manter layout vertical */
    .water-hero-card { padding: 20px 16px 18px; flex-direction: column; align-items: center; }
    .water-big-num { font-size: 36px; }
  }
  @media (max-width: 640px) {
    .sidebar { display: none; }
    .mobile-nav { display: block; }
    .inner { padding: 16px 14px 80px; }
    .pg-header { flex-direction: column; gap: 8px; }
    .status-pill { align-self: flex-start; }
    .greeting { font-size: 20px; }
    .hist-stats { grid-template-columns: 1fr 1fr; gap: 8px; }
    .mprog-row-label { width: 26px; font-size: 9px; }
    .mprog-pct { width: 28px; font-size: 10.5px; }
    .mprog-head { flex-wrap: wrap; gap: 4px; }
  }
  @media (max-width: 480px) {
    .stat-val { font-size: 20px; }
    .stat-trend { display: none; }
    .week-pct-canvas { height: 160px; }
    .macro-row .macro-spark { display: none; }
  }
  @media (max-width: 420px) {
    .ring-card { gap: 14px; padding: 14px; }
    .ring-wrap { width: 96px; height: 96px; }
    .ring-big { font-size: 20px; }
    .ring-of { font-size: 10px; }
    .ring-pct { font-size: 11px; }
    .ring-tip { font-size: 10.5px; }
    .remain-chip { font-size: 11px; padding: 2px 8px; }
    .macro-row { grid-template-columns: repeat(2, 1fr); }
    .water-big-num { font-size: 28px; }
  }

  /* ── Ring context (média 7 dias) ────────────────────── */
  .ring-context {
    font-size: 11px; color: var(--text-3); text-align: center;
    margin-top: 10px; padding-top: 10px;
    border-top: 1px solid rgba(10,87,56,.08); width: 100%;
  }
  .ring-context strong { color: var(--text-2); font-weight: 600; }

  /* ── Reduced motion ─────────────────────────────────── */
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      transition-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
    }
  }
  </style>

  {% block head %}{% endblock %}
</head>
<body>
{% block body %}{% endblock %}

<!-- PWA Service Worker -->
<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('/static/sw.js')
        .catch(err => console.warn('SW registration failed:', err));
    });
  }
</script>
{% block scripts %}{% endblock %}
</body>
</html>
