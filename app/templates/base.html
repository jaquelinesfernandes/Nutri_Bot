<!doctype html>
<html lang="pt-BR" class="h-full">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>{% block title %}NutriBot{% endblock %}</title>

  <!-- Tailwind CDN — mantido para páginas legadas (historico, configuracoes, etc.) -->
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      theme: { extend: { colors: { brand: { 500:'#6366F1', 600:'#4F46E5', 700:'#4338CA' } } } }
    }
  </script>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Sans:opsz,wght@9..40,300;9..40,400;9..40,500;9..40,600&family=DM+Mono:wght@400;500&display=swap">

  <style>
  /* ── Design tokens — Modern Purple-Blue ─────────────── */
  :root {
    --primary:      #6366F1;
    --primary-d:    #4F46E5;
    --primary-lt:   #EEF2FF;
    --violet:       #7C3AED;
    --violet-lt:    #F5F3FF;
    --cyan:         #0EA5E9;
    --cyan-lt:      #E0F2FE;
    --sidebar-bg:   #0F0D2E;
    --sidebar-hov:  #1A1750;
    --sidebar-act:  rgba(99,102,241,.15);
    --surface:      #FFFFFF;
    --card:         #FFFFFF;
    --card-b:       rgba(99,102,241,.1);
    --text-1:       #1E1B4B;
    --text-2:       #4C4980;
    --text-3:       #9096C0;
    --prot-c:       #6366F1;
    --prot-lt:      #EEF2FF;
    --carb-c:       #0EA5E9;
    --carb-lt:      #E0F2FE;
    --fat-c:        #A855F7;
    --fat-lt:       #F5F3FF;
    --ok-c:         #6366F1;
    --warn-c:       #F59E0B;
    --over-c:       #EF4444;
    --shadow-sm:    0 1px 3px rgba(99,102,241,.08), 0 1px 2px rgba(99,102,241,.05);
    --shadow-md:    0 4px 20px rgba(99,102,241,.1), 0 1px 6px rgba(99,102,241,.06);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --sidebar-bg:  #07061A;
      --sidebar-hov: #100E30;
      --surface:     #090818;
      --card:        #111030;
      --card-b:      rgba(99,102,241,.18);
      --text-1:      #E0DEFF;
      --text-2:      #7B78C8;
      --text-3:      #4A487A;
      --primary-lt:  #1E1C50;
      --violet-lt:   #1A1040;
      --cyan-lt:     #071E30;
      --prot-lt:     #1E1C50;
      --carb-lt:     #071E30;
      --fat-lt:      #1A1040;
      --shadow-sm:   0 1px 3px rgba(0,0,0,.4);
      --shadow-md:   0 4px 20px rgba(0,0,0,.55);
    }
  }
  :root[data-theme="dark"] {
    --sidebar-bg:  #07061A;
    --sidebar-hov: #100E30;
    --surface:     #090818;
    --card:        #111030;
    --card-b:      rgba(99,102,241,.18);
    --text-1:      #E0DEFF;
    --text-2:      #7B78C8;
    --text-3:      #4A487A;
    --primary-lt:  #1E1C50;
    --violet-lt:   #1A1040;
    --cyan-lt:     #071E30;
    --prot-lt:     #1E1C50;
    --carb-lt:     #071E30;
    --fat-lt:      #1A1040;
    --shadow-sm:   0 1px 3px rgba(0,0,0,.4);
    --shadow-md:   0 4px 20px rgba(0,0,0,.55);
  }

  /* ── Reset ──────────────────────────────────────────── */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  html { height: 100%; }
  html body {
    font-family: 'DM Sans', system-ui, sans-serif;
    background: var(--surface);
    color: var(--text-1);
    font-size: 14px;
    line-height: 1.5;
    height: 100%;
  }

  /* ── App shell ──────────────────────────────────────── */
  .app { display: flex; height: 100%; min-height: 100vh; }

  /* ── Sidebar ────────────────────────────────────────── */
  .sidebar {
    width: 220px;
    background: var(--sidebar-bg);
    display: flex; flex-direction: column; flex-shrink: 0;
    position: sticky; top: 0; height: 100vh; overflow: hidden;
  }
  .sb-logo {
    display: flex; align-items: center; gap: 10px;
    padding: 22px 20px 18px;
    border-bottom: 1px solid rgba(255,255,255,.06);
  }
  .sb-leaf {
    width: 32px; height: 32px;
    background: linear-gradient(135deg, var(--primary), var(--violet));
    border-radius: 9px; display: grid; place-items: center;
    font-size: 16px; flex-shrink: 0;
  }
  .sb-brand { font-weight: 600; font-size: 15.5px; color: #DDD8FF; letter-spacing: -.25px; }
  .sb-brand em { font-style: normal; color: #A5B4FC; }
  .sb-nav { flex: 1; padding: 14px 10px; display: flex; flex-direction: column; gap: 2px; }
  .sb-sect {
    font-size: 10px; font-weight: 600; letter-spacing: .09em;
    text-transform: uppercase; color: rgba(255,255,255,.2);
    padding: 8px 10px 4px;
  }
  .sb-link {
    display: flex; align-items: center; gap: 10px;
    padding: 9px 10px; border-radius: 8px;
    font-size: 13.5px; font-weight: 500; color: rgba(255,255,255,.45);
    transition: background .15s, color .15s;
    border-left: 3px solid transparent; cursor: pointer;
    text-decoration: none;
  }
  .sb-link:hover { background: var(--sidebar-hov); color: rgba(255,255,255,.8); }
  .sb-link.active { background: var(--sidebar-act); color: #A5B4FC; border-left-color: var(--primary); }
  .sb-icon { width: 17px; height: 17px; flex-shrink: 0; opacity: .7; }
  .sb-link.active .sb-icon { opacity: 1; }
  .sb-foot { padding: 12px 10px; border-top: 1px solid rgba(255,255,255,.06); }
  .sb-user { display: flex; align-items: center; gap: 9px; padding: 7px 10px; margin-bottom: 2px; }
  .sb-avatar {
    width: 28px; height: 28px; border-radius: 50%;
    background: linear-gradient(135deg, var(--primary), var(--violet));
    display: grid; place-items: center;
    font-size: 12px; font-weight: 600; color: #fff; flex-shrink: 0;
  }
  .sb-username {
    font-size: 12.5px; font-weight: 500; color: rgba(255,255,255,.55);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .sb-logout {
    display: flex; align-items: center; gap: 10px;
    width: 100%; padding: 8px 10px; border-radius: 8px;
    background: none; border: none; cursor: pointer;
    font-size: 13px; color: rgba(255,255,255,.3); font-family: inherit;
    transition: background .15s, color .15s;
  }
  .sb-logout:hover { background: var(--sidebar-hov); color: rgba(255,255,255,.6); }

  /* ── Mobile bottom nav ──────────────────────────────── */
  .mobile-nav {
    display: none; position: fixed; bottom: 0; left: 0; right: 0;
    background: var(--sidebar-bg); border-top: 1px solid rgba(255,255,255,.07);
    z-index: 50; padding: 0 4px env(safe-area-inset-bottom, 0);
  }
  .mobile-nav-inner { display: flex; justify-content: space-around; align-items: stretch; }
  .mob-link {
    flex: 1; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 3px; padding: 10px 4px;
    color: rgba(255,255,255,.35); font-size: 10px; font-weight: 500;
    cursor: pointer; transition: color .15s; border: none; background: none; font-family: inherit;
  }
  .mob-link.active { color: #A5B4FC; }
  .mob-link svg { width: 20px; height: 20px; }

  /* ── Main content ───────────────────────────────────── */
  .main { flex: 1; overflow-y: auto; min-width: 0; }
  .inner { max-width: 1080px; margin: 0 auto; padding: 28px 24px 40px; }

  /* ── Page header ────────────────────────────────────── */
  .pg-header {
    display: flex; align-items: flex-start;
    justify-content: space-between; gap: 12px; margin-bottom: 24px;
  }
  .greeting {
    font-family: 'DM Serif Display', Georgia, serif;
    font-size: 26px; line-height: 1.2; color: var(--text-1); text-wrap: balance;
  }
  .greeting em { font-style: normal; color: var(--primary); }
  .today-date { font-size: 12.5px; color: var(--text-3); margin-top: 4px; }
  .status-pill {
    display: flex; align-items: center; gap: 6px;
    padding: 6px 12px; background: var(--card);
    border: 1px solid var(--card-b); border-radius: 20px;
    font-size: 12px; color: var(--text-2); box-shadow: var(--shadow-sm);
    flex-shrink: 0; white-space: nowrap;
  }
  .dot-live { width: 7px; height: 7px; border-radius: 50%; background: #4CAF50; }

  /* ── Section label ──────────────────────────────────── */
  .sect-label {
    display: flex; align-items: center; gap: 8px;
    font-size: 11px; font-weight: 600; letter-spacing: .07em;
    text-transform: uppercase; color: var(--text-3);
    margin-bottom: 12px; margin-top: 28px;
  }
  .sect-label::before {
    content: ''; display: inline-block; width: 3px; height: 12px;
    background: linear-gradient(to bottom, var(--primary), var(--violet));
    border-radius: 2px; flex-shrink: 0;
  }

  /* ── Card base ──────────────────────────────────────── */
  .card {
    background: var(--card); border-radius: 20px;
    box-shadow: 0 2px 8px rgba(99,102,241,.07), 0 8px 24px rgba(99,102,241,.05);
    border: 1px solid var(--card-b);
    transition: box-shadow .2s ease, transform .2s ease;
  }
  .card:hover {
    box-shadow: 0 4px 14px rgba(99,102,241,.13), 0 12px 32px rgba(99,102,241,.09);
    transform: translateY(-1px);
  }
  .card-pad { padding: 22px; }
  .card-title {
    font-size: 13px; font-weight: 600; color: var(--text-2);
    margin-bottom: 18px; display: flex; align-items: center; justify-content: space-between;
  }
  .chip { font-size: 11px; font-weight: 500; padding: 3px 9px; border-radius: 20px; }
  .chip-sage  { background: var(--primary-lt); color: var(--primary); }
  .chip-amber { background: var(--violet-lt);  color: var(--violet); }

  /* ── S1: Today overview ─────────────────────────────── */
  .today-grid {
    display: grid; grid-template-columns: 250px 1fr;
    gap: 14px; align-items: stretch;
  }

  /* Dark cards — Calorias + Macros */
  .ring-card, .macro-card {
    background: linear-gradient(145deg, #1E1B4B 0%, #13113D 100%);
    border-color: rgba(99,102,241,.25);
    box-shadow: 0 4px 18px rgba(0,0,0,.22), 0 2px 6px rgba(0,0,0,.14);
  }
  .ring-card:hover, .macro-card:hover {
    box-shadow: 0 6px 24px rgba(0,0,0,.3), 0 14px 36px rgba(0,0,0,.2);
    transform: translateY(-2px);
  }

  .ring-card {
    display: flex; flex-direction: column; align-items: center;
    padding: 24px 20px 22px; position: relative; overflow: hidden;
  }
  .ring-card::before {
    content: ''; position: absolute; bottom: -30px; left: -30px;
    width: 160px; height: 160px;
    background: radial-gradient(circle, rgba(99,102,241,.25) 0%, transparent 70%);
    border-radius: 50%; pointer-events: none;
  }
  .ring-card::after {
    content: ''; position: absolute; top: -20px; right: -20px;
    width: 110px; height: 110px;
    background: radial-gradient(circle, rgba(14,165,233,.2) 0%, transparent 70%);
    border-radius: 50%; pointer-events: none;
  }
  .ring-eyebrow {
    align-self: flex-start; font-size: 10.5px; font-weight: 600;
    letter-spacing: .07em; text-transform: uppercase;
    color: rgba(255,255,255,.4); margin-bottom: 16px;
  }
  .ring-wrap { position: relative; width: 160px; height: 160px; margin-bottom: 16px; }
  .ring-wrap svg { transform: rotate(-90deg); display: block; }
  .r-track { fill: none; stroke: rgba(255,255,255,.1); stroke-width: 12; }
  .r-fill  { fill: none; stroke-width: 12; stroke-linecap: round; }
  .r-fill-ok   { stroke: url(#ringGrad); }
  .r-fill-warn { stroke: #FBBF24; }
  .r-fill-over { stroke: #F87171; }
  .ring-center {
    position: absolute; inset: 0; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 2px;
  }
  .ring-big {
    font-family: 'DM Serif Display', Georgia, serif;
    font-size: 32px; line-height: 1; color: #E0DEFF;
  }
  .ring-of { font-size: 11px; color: rgba(255,255,255,.38); margin-top: 3px; }
  .ring-pct { font-size: 12.5px; font-weight: 700; color: #A5B4FC; margin-top: 2px; }
  .ring-info { display: flex; flex-direction: column; gap: 8px; }
  .ring-remain {
    font-size: 12.5px; color: rgba(255,255,255,.5);
    display: flex; align-items: center; gap: 7px;
  }
  .remain-chip {
    background: rgba(99,102,241,.35); color: #A5B4FC;
    padding: 3px 10px; border-radius: 20px;
    font-size: 12px; font-weight: 600; border: 1px solid rgba(99,102,241,.4);
  }
  .ring-tip {
    margin-top: 4px; font-size: 11.5px; color: rgba(255,255,255,.32);
    text-align: center; font-style: italic;
  }

  .macro-stack { display: flex; flex-direction: column; gap: 10px; }
  .macro-card {
    display: flex; align-items: center; gap: 14px;
    padding: 15px 18px; flex: 1;
    transition: box-shadow .2s ease, transform .2s ease;
  }
  .macro-icon {
    width: 36px; height: 36px; border-radius: 10px;
    display: grid; place-items: center; font-size: 17px; flex-shrink: 0;
  }
  .macro-icon.prot { background: rgba(99,102,241,.3); }
  .macro-icon.carb { background: rgba(14,165,233,.28); }
  .macro-icon.fat  { background: rgba(168,85,247,.28); }
  .macro-body { flex: 1; min-width: 0; }
  .macro-lbl {
    font-size: 10.5px; font-weight: 600; letter-spacing: .06em;
    text-transform: uppercase; color: rgba(255,255,255,.4); margin-bottom: 2px;
  }
  .macro-num {
    font-family: 'DM Serif Display', Georgia, serif;
    font-size: 24px; line-height: 1; color: #E0DEFF;
  }
  .macro-num small {
    font-family: 'DM Sans', sans-serif;
    font-size: 12px; color: rgba(255,255,255,.35); font-style: normal;
  }
  .macro-sub { font-size: 11.5px; color: rgba(255,255,255,.4); margin-top: 3px; }
  .macro-mini-track {
    height: 4px; border-radius: 2px; background: rgba(255,255,255,.1);
    margin-top: 7px; overflow: hidden;
  }
  .macro-mini-fill { height: 100%; border-radius: 2px; }
  .macro-spark { width: 56px; height: 30px; flex-shrink: 0; overflow: visible; }

  /* ── S2: 7-day chart ────────────────────────────────── */
  .week-pct-canvas { width: 100%; height: 200px; display: block; }

  /* ── S3: Historical + macro % ────────────────────────── */
  .insights-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .insights-grid > .card { display: flex; flex-direction: column; }

  .hist-stats {
    display: grid; grid-template-columns: repeat(4, 1fr);
    gap: 8px; margin-bottom: 18px;
  }
  .stat-box {
    background: var(--primary-lt); border-radius: 12px;
    padding: 14px 10px 12px;
    border: 1px solid rgba(99,102,241,.1); border-top: 3px solid transparent;
  }
  .stat-box.good  { border-top-color: #6366F1; }
  .stat-box.warn  { border-top-color: #EF4444; }
  .stat-box.amber { border-top-color: #0EA5E9; }
  .stat-box.best  { border-top-color: #A855F7; }
  .stat-top { display: flex; align-items: baseline; gap: 4px; flex-wrap: wrap; }
  .stat-val {
    font-family: 'DM Serif Display', Georgia, serif;
    font-size: 24px; color: var(--text-1); line-height: 1;
  }
  .stat-trend {
    font-size: 10px; font-weight: 700; padding: 1px 5px; border-radius: 20px; white-space: nowrap;
  }
  .stat-trend.up   { color: #6366F1; background: rgba(99,102,241,.12); }
  .stat-trend.down { color: #EF4444; background: rgba(239,68,68,.1); }
  .stat-trend.sky  { color: #0EA5E9; background: rgba(14,165,233,.1); }
  .stat-lbl { font-size: 10.5px; color: var(--text-3); margin-top: 5px; line-height: 1.35; }

  .hist-chart-wrap { flex: 1; display: flex; flex-direction: column; min-height: 80px; }
  .mini-hist-label {
    font-size: 11px; font-weight: 600; letter-spacing: .05em;
    text-transform: uppercase; color: var(--text-3); margin-bottom: 8px;
  }
  .mini-hist { width: 100%; flex: 1; min-height: 64px; display: block; }

  .mprog-compare {
    flex: 1; display: flex; flex-direction: column;
    justify-content: space-between; gap: 0;
  }
  .mprog-head {
    display: flex; justify-content: space-between; align-items: center;
    font-size: 12.5px; margin-bottom: 10px;
  }
  .mprog-name { font-weight: 600; display: flex; align-items: center; gap: 6px; color: var(--text-1); }
  .mprog-dot  { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }
  .mprog-meta { font-size: 11px; color: var(--text-3); font-variant-numeric: tabular-nums; }
  .mprog-tracks { display: flex; flex-direction: column; gap: 5px; }
  .mprog-row { display: flex; align-items: center; gap: 8px; }
  .mprog-row-label {
    font-size: 10px; font-weight: 600; letter-spacing: .04em;
    text-transform: uppercase; color: var(--text-3);
    width: 32px; flex-shrink: 0; text-align: right;
  }
  .mprog-track { flex: 1; border-radius: 5px; background: rgba(99,102,241,.08); overflow: hidden; }
  .mprog-track.today { height: 9px; }
  .mprog-track.avg   { height: 6px; }
  .mprog-fill {
    height: 100%; border-radius: 5px;
    transition: width .6s cubic-bezier(.16,1,.3,1);
  }
  .mprog-pct {
    font-family: 'DM Mono', monospace; font-size: 11.5px;
    font-variant-numeric: tabular-nums;
    width: 32px; text-align: right; flex-shrink: 0; color: var(--text-2);
  }
  .mprog-pct.dim { color: var(--text-3); font-size: 10.5px; }
  .mprog-legend {
    display: flex; gap: 16px; align-items: center;
    margin-top: 6px; padding-top: 14px; border-top: 1px solid var(--card-b);
  }
  .mprog-legend-item { display: flex; align-items: center; gap: 5px; font-size: 11px; color: var(--text-3); }
  .mprog-legend-swatch { border-radius: 2px; flex-shrink: 0; }

  /* ── Meals ──────────────────────────────────────────── */
  .meals-list { display: flex; flex-direction: column; }
  .meal-row {
    display: flex; align-items: center; gap: 12px;
    padding: 12px 10px; border-radius: 12px;
    transition: background .15s; margin: 0 -10px;
  }
  .meal-row:hover { background: rgba(99,102,241,.04); }
  .meal-sep { height: 1px; background: var(--card-b); margin: 0; }
  .meal-color-bar { width: 3px; height: 38px; border-radius: 2px; flex-shrink: 0; }
  .meal-inf { flex: 1; min-width: 0; }
  .meal-name { font-size: 13px; font-weight: 600; color: var(--text-1); }
  .meal-foods {
    font-size: 11.5px; color: var(--text-3);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; margin-top: 2px;
  }
  .meal-time {
    font-family: 'DM Mono', monospace; font-size: 11px; color: var(--text-3);
    background: rgba(99,102,241,.07); padding: 2px 7px; border-radius: 6px;
    flex-shrink: 0; font-variant-numeric: tabular-nums;
  }
  .meal-kcal {
    font-family: 'DM Mono', monospace; font-size: 13px; font-weight: 500;
    color: var(--text-2); flex-shrink: 0; font-variant-numeric: tabular-nums;
    min-width: 62px; text-align: right;
  }
  .no-meals { text-align: center; padding: 32px 0; }
  .no-meals .icon { font-size: 32px; margin-bottom: 10px; }
  .no-meals p { font-size: 13px; color: var(--text-2); }
  .no-meals small { font-size: 12px; color: var(--text-3); display: block; margin-top: 4px; }

  /* ── Responsive ─────────────────────────────────────── */
  @media (max-width: 860px) {
    .insights-grid { grid-template-columns: 1fr; }
    .stat-box { padding: 12px 8px 10px; }
    .stat-val { font-size: 21px; }
  }
  @media (max-width: 720px) {
    .today-grid { grid-template-columns: 1fr; }
    .ring-card { flex-direction: row; gap: 20px; padding: 18px; align-items: center; }
    .ring-card::after { display: none; }
    .ring-eyebrow { display: none; }
    .ring-wrap { width: 120px; height: 120px; flex-shrink: 0; margin-bottom: 0; }
    .ring-big { font-size: 24px; }
    .ring-remain { flex-direction: column; align-items: flex-start; gap: 4px; }
  }
  @media (max-width: 640px) {
    .sidebar { display: none; }
    .mobile-nav { display: block; }
    .inner { padding: 16px 14px 80px; }
    .pg-header { flex-direction: column; gap: 8px; }
    .status-pill { align-self: flex-start; }
    .greeting { font-size: 20px; }
    .hist-stats { grid-template-columns: 1fr 1fr; gap: 8px; }
    .mprog-row-label { width: 26px; font-size: 9px; }
    .mprog-pct { width: 28px; font-size: 10.5px; }
    .mprog-head { flex-wrap: wrap; gap: 4px; }
  }
  @media (max-width: 480px) {
    .stat-val { font-size: 20px; }
    .stat-trend { display: none; }
    .week-pct-canvas { height: 160px; }
  }
  </style>

  {% block head %}{% endblock %}
</head>
<body>
{% block body %}{% endblock %}
</body>
</html>
