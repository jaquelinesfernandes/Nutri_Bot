{% extends "base.html" %}
{% block body %}
<div class="flex h-full min-h-screen">

  <!-- Sidebar -->
  <aside class="w-56 bg-slate-800 text-white flex flex-col shrink-0">
    <div class="px-6 py-5 border-b border-slate-700">
      <span class="text-2xl">🥗</span>
      <span class="ml-2 font-bold text-lg tracking-tight">NutriBot</span>
    </div>
    <nav class="flex-1 px-3 py-4 space-y-1 text-sm">
      <a href="/dashboard"
         class="flex items-center gap-3 px-3 py-2 rounded-lg {% if active == 'dashboard' %}bg-brand-600 text-white{% else %}text-slate-300 hover:bg-slate-700{% endif %}">
        <span>📊</span> Dashboard
      </a>
      <a href="/historico"
         class="flex items-center gap-3 px-3 py-2 rounded-lg {% if active == 'historico' %}bg-brand-600 text-white{% else %}text-slate-300 hover:bg-slate-700{% endif %}">
        <span>📅</span> Histórico
      </a>
      <a href="/relatorios"
         class="flex items-center gap-3 px-3 py-2 rounded-lg {% if active == 'relatorios' %}bg-brand-600 text-white{% else %}text-slate-300 hover:bg-slate-700{% endif %}">
        <span>📄</span> Relatórios
      </a>
      <a href="/configuracoes"
         class="flex items-center gap-3 px-3 py-2 rounded-lg {% if active == 'configuracoes' %}bg-brand-600 text-white{% else %}text-slate-300 hover:bg-slate-700{% endif %}">
        <span>⚙️</span> Configurações
      </a>
    </nav>
    <div class="px-3 py-4 border-t border-slate-700">
      <p class="px-3 text-xs text-slate-400 mb-2 truncate">{{ user.first_name or user.email or 'Usuário' }}</p>
      <form action="/api/auth/logout" method="post">
        <button type="submit"
          class="w-full text-left flex items-center gap-3 px-3 py-2 rounded-lg text-slate-300 hover:bg-slate-700 text-sm">
          <span>🚪</span> Sair
        </button>
      </form>
    </div>
  </aside>

  <!-- Main -->
  <main class="flex-1 overflow-y-auto">
    <div class="max-w-5xl mx-auto px-6 py-8">
      {% block content %}{% endblock %}
    </div>
  </main>

</div>
{% endblock %}
