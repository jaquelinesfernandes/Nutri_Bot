{% extends "base.html" %}
{% block body %}
<div class="app">

  <!-- ── Sidebar (desktop) ───────────────────────────── -->
  <aside class="sidebar">
    <div class="sb-logo">
      <div class="sb-leaf">🌿</div>
      <span class="sb-brand">Nutri<em>Bot</em></span>
    </div>

    <nav class="sb-nav">
      <div class="sb-sect">Menu</div>

      <a href="/dashboard" class="sb-link {% if active == 'dashboard' %}active{% endif %}">
        <svg class="sb-icon" viewBox="0 0 20 20" fill="currentColor">
          <path d="M2 11a1 1 0 011-1h3a1 1 0 011 1v5a1 1 0 01-1 1H3a1 1 0 01-1-1v-5zm6-7a1 1 0 011-1h3a1 1 0 011 1v12a1 1 0 01-1 1H9a1 1 0 01-1-1V4zm6 4a1 1 0 011-1h3a1 1 0 011 1v8a1 1 0 01-1 1h-3a1 1 0 01-1-1V8z"/>
        </svg>
        Dashboard
      </a>

      <a href="/historico" class="sb-link {% if active == 'historico' %}active{% endif %}">
        <svg class="sb-icon" viewBox="0 0 20 20" fill="currentColor">
          <path fill-rule="evenodd" d="M6 2a1 1 0 00-1 1v1H4a2 2 0 00-2 2v10a2 2 0 002 2h12a2 2 0 002-2V6a2 2 0 00-2-2h-1V3a1 1 0 10-2 0v1H7V3a1 1 0 00-1-1zm0 5a1 1 0 000 2h8a1 1 0 100-2H6z" clip-rule="evenodd"/>
        </svg>
        Histórico
      </a>

      <a href="/relatorios" class="sb-link {% if active == 'relatorios' %}active{% endif %}">
        <svg class="sb-icon" viewBox="0 0 20 20" fill="currentColor">
          <path fill-rule="evenodd" d="M4 4a2 2 0 012-2h4.586A2 2 0 0112 2.586L15.414 6A2 2 0 0116 7.414V16a2 2 0 01-2 2H6a2 2 0 01-2-2V4zm2 6a1 1 0 011-1h6a1 1 0 110 2H7a1 1 0 01-1-1zm1 3a1 1 0 100 2h6a1 1 0 100-2H7z" clip-rule="evenodd"/>
        </svg>
        Relatórios
      </a>

      <a href="/configuracoes" class="sb-link {% if active == 'configuracoes' %}active{% endif %}">
        <svg class="sb-icon" viewBox="0 0 20 20" fill="currentColor">
          <path fill-rule="evenodd" d="M11.49 3.17c-.38-1.56-2.6-1.56-2.98 0a1.532 1.532 0 01-2.286.948c-1.372-.836-2.942.734-2.106 2.106.54.886.061 2.042-.947 2.287-1.561.379-1.561 2.6 0 2.978a1.532 1.532 0 01.947 2.287c-.836 1.372.734 2.942 2.106 2.106a1.532 1.532 0 012.287.947c.379 1.561 2.6 1.561 2.978 0a1.533 1.533 0 012.287-.947c1.372.836 2.942-.734 2.106-2.106a1.533 1.533 0 01.947-2.287c1.561-.379 1.561-2.6 0-2.978a1.532 1.532 0 01-.947-2.287c.836-1.372-.734-2.942-2.106-2.106a1.532 1.532 0 01-2.287-.947zM10 13a3 3 0 100-6 3 3 0 000 6z" clip-rule="evenodd"/>
        </svg>
        Configurações
      </a>
    </nav>

    <div class="sb-foot">
      <div class="sb-user">
        <div class="sb-avatar">{{ (user.first_name or user.email or 'U')[0] | upper }}</div>
        <span class="sb-username">{{ user.first_name or user.email or 'Usuário' }}</span>
      </div>
      <form action="/api/auth/logout" method="post">
        <button type="submit" class="sb-logout">
          <svg style="width:15px;height:15px" viewBox="0 0 20 20" fill="currentColor">
            <path fill-rule="evenodd" d="M3 3a1 1 0 00-1 1v12a1 1 0 001 1h6a1 1 0 100-2H4V5h5a1 1 0 000-2H3zm11.707 4.293a1 1 0 010 1.414L13.414 10l1.293 1.293a1 1 0 01-1.414 1.414l-2-2a1 1 0 010-1.414l2-2a1 1 0 011.414 0z" clip-rule="evenodd"/>
            <path fill-rule="evenodd" d="M13 10a1 1 0 01-1 1H7a1 1 0 110-2h5a1 1 0 011 1z" clip-rule="evenodd"/>
          </svg>
          Sair
        </button>
      </form>
    </div>
  </aside>

  <!-- ── Mobile bottom nav ────────────────────────────── -->
  <nav class="mobile-nav" aria-label="Navegação">
    <div class="mobile-nav-inner">
      <a href="/dashboard" class="mob-link {% if active == 'dashboard' %}active{% endif %}">
        <svg viewBox="0 0 20 20" fill="currentColor"><path d="M2 11a1 1 0 011-1h3a1 1 0 011 1v5a1 1 0 01-1 1H3a1 1 0 01-1-1v-5zm6-7a1 1 0 011-1h3a1 1 0 011 1v12a1 1 0 01-1 1H9a1 1 0 01-1-1V4zm6 4a1 1 0 011-1h3a1 1 0 011 1v8a1 1 0 01-1 1h-3a1 1 0 01-1-1V8z"/></svg>
        Início
      </a>
      <a href="/historico" class="mob-link {% if active == 'historico' %}active{% endif %}">
        <svg viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M6 2a1 1 0 00-1 1v1H4a2 2 0 00-2 2v10a2 2 0 002 2h12a2 2 0 002-2V6a2 2 0 00-2-2h-1V3a1 1 0 10-2 0v1H7V3a1 1 0 00-1-1zm0 5a1 1 0 000 2h8a1 1 0 100-2H6z" clip-rule="evenodd"/></svg>
        Histórico
      </a>
      <a href="/relatorios" class="mob-link {% if active == 'relatorios' %}active{% endif %}">
        <svg viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M4 4a2 2 0 012-2h4.586A2 2 0 0112 2.586L15.414 6A2 2 0 0116 7.414V16a2 2 0 01-2 2H6a2 2 0 01-2-2V4zm2 6a1 1 0 011-1h6a1 1 0 110 2H7a1 1 0 01-1-1zm1 3a1 1 0 100 2h6a1 1 0 100-2H7z" clip-rule="evenodd"/></svg>
        Relatórios
      </a>
      <a href="/configuracoes" class="mob-link {% if active == 'configuracoes' %}active{% endif %}">
        <svg viewBox="0 0 20 20" fill="currentColor"><path fill-rule="evenodd" d="M11.49 3.17c-.38-1.56-2.6-1.56-2.98 0a1.532 1.532 0 01-2.286.948c-1.372-.836-2.942.734-2.106 2.106.54.886.061 2.042-.947 2.287-1.561.379-1.561 2.6 0 2.978a1.532 1.532 0 01.947 2.287c-.836 1.372.734 2.942 2.106 2.106a1.532 1.532 0 012.287.947c.379 1.561 2.6 1.561 2.978 0a1.533 1.533 0 012.287-.947c1.372.836 2.942-.734 2.106-2.106a1.533 1.533 0 01.947-2.287c1.561-.379 1.561-2.6 0-2.978a1.532 1.532 0 01-.947-2.287c.836-1.372-.734-2.942-2.106-2.106a1.532 1.532 0 01-2.287-.947zM10 13a3 3 0 100-6 3 3 0 000 6z" clip-rule="evenodd"/></svg>
        Config
      </a>
    </div>
  </nav>

  <!-- ── Main content ─────────────────────────────────── -->
  <main class="main">
    <div class="inner">
      {% block content %}{% endblock %}
    </div>
  </main>

</div>
{% endblock %}
