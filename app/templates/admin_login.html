<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Login — NutriBot Admin</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #0B1120; color: #E2E8F0;
      font-family: system-ui, -apple-system, sans-serif;
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      padding: 20px;
    }
    .login-card {
      background: #111827; border: 1px solid rgba(148,163,184,.1);
      border-radius: 16px; padding: 36px 32px; width: 100%; max-width: 380px;
      box-shadow: 0 16px 48px rgba(0,0,0,.4);
    }
    .login-logo {
      text-align: center; margin-bottom: 28px;
    }
    .login-logo .emoji { font-size: 2.5rem; display: block; margin-bottom: 8px; }
    .login-logo h1 { font-size: 20px; font-weight: 700; }
    .login-logo .sub {
      font-size: 11px; font-weight: 600; letter-spacing: .08em;
      text-transform: uppercase; color: #94A3B8; margin-top: 4px;
    }
    .form-group { margin-bottom: 18px; }
    label { font-size: 12px; color: #94A3B8; display: block; margin-bottom: 5px; }
    input[type="password"] {
      width: 100%; background: #1A2235; border: 1px solid rgba(148,163,184,.15);
      border-radius: 8px; color: #E2E8F0; padding: 10px 14px;
      font-size: 14px; outline: none; transition: border-color .15s;
    }
    input[type="password"]:focus { border-color: #6366F1; }
    .btn-login {
      width: 100%; padding: 11px; border-radius: 8px;
      background: #6366F1; color: #fff; border: none;
      font-size: 14px; font-weight: 600; cursor: pointer;
      transition: opacity .15s;
    }
    .btn-login:hover { opacity: .88; }
    .error-msg {
      background: rgba(239,68,68,.1); border: 1px solid rgba(239,68,68,.25);
      color: #F87171; border-radius: 8px; padding: 10px 14px;
      font-size: 13px; margin-bottom: 16px;
    }
    .footer-note { text-align: center; font-size: 11px; color: #475569; margin-top: 20px; }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="login-logo">
      <span class="emoji">🥦</span>
      <h1>NutriBot</h1>
      <div class="sub">Painel Administrativo</div>
    </div>

    {% if error %}
    <div class="error-msg">⚠️ {{ error }}</div>
    {% endif %}

    <form method="post" action="/admin/login">
      <div class="form-group">
        <label for="password">Senha de acesso</label>
        <input type="password" id="password" name="password"
               placeholder="••••••••••••" autofocus autocomplete="current-password">
      </div>
      <button type="submit" class="btn-login">Entrar no painel</button>
    </form>

    <div class="footer-note">Sessão expira em 2 horas por segurança.</div>
  </div>
</body>
</html>
